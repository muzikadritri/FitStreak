name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        run: ./gradlew :core:test :app:testReleaseUnitTest --stacktrace

      - name: Signierte Release-APK bauen
        run: ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: APK benennen
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FitStreak-v${VERSION_NAME}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      - name: GitHub Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then PRERELEASE="--prerelease"; fi
          gh release create "v${VERSION_NAME}" "dist/FitStreak-v${VERSION_NAME}.apk" \
            --target "${GITHUB_SHA}" \
            --title "FitStreak v${VERSION_NAME}" \
            --notes "Automatischer Build von \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}).

          **Installation auf dem Handy:** Unten bei „Assets“ die Datei \`FitStreak-v${VERSION_NAME}.apk\` antippen, herunterladen und öffnen. Updates lassen sich einfach über die alte Version installieren – deine Daten bleiben erhalten." \
            $PRERELEASE

      # Hilft beim Pflegen der Versionen in gradle/libs.versions.toml
      - name: Verfügbare Bibliotheks-Versionen anzeigen
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[versions]')
        run: |
          for a in com/android/tools/build/gradle androidx/compose/compose-bom androidx/activity/activity-compose androidx/core/core-ktx androidx/lifecycle/lifecycle-runtime-compose androidx/navigation/navigation-compose androidx/room/room-runtime androidx/datastore/datastore androidx/glance/glance-appwidget androidx/compose/material/material-icons-core androidx/test/ext/junit androidx/compose/ui/ui androidx/compose/material3/material3; do
            echo "== $a"
            curl -s "https://dl.google.com/android/maven2/$a/maven-metadata.xml" | grep -oP '(?<=<version>)[^<]+' | grep -viE 'alpha|beta|rc|dev' | tail -6 | tr '\n' ' '
            echo
          done

  # Installiert die fertige APK auf Emulatoren (Android 8 und aktuell) und prüft:
  # Start ohne Absturz, Onboarding, Erinnerungen, Zufalls-Eingaben, Neustart.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
          - api-level: 35
            target: google_apis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rauchtest auf dem Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 .github/scripts/smoke_test.py dist/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots-api${{ matrix.api-level }}
          path: smoke-shots
          if-no-files-found: ignore
